# A v* tag cross-builds both windows binaries on ubuntu, signs them on a windows
# runner when the code-signing certificate secret exists, and publishes them with
# their checksums. Signing is optional: without the secret the sign job is
# skipped and the release still goes out, unsigned.

name: release

on:
  push:
    tags: ['v*']

# Read by default. Only the publish job creates a release, and it is the only
# job that asks for write.
permissions:
  contents: read

jobs:
  build:
    name: cross-build
    runs-on: ubuntu-latest
    outputs:
      # A secret cannot be read from a job-level `if:`, so whether signing is
      # possible has to travel to the next job as an output.
      sign: ${{ steps.cert.outputs.present }}
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install go from the version in go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: quality gates
        # The same target that gates a commit locally. Without this the build
        # job ran the cross-build directly, so a v* tag pushed at a commit whose
        # ci run is red still cross-built, signed and published. tests/ is
        # gitignored, so `make test` prints and passes on a runner.
        run: make check

      - name: build both windows architectures at the tag version
        # The tag drives -X main.version, so v0.1.0 stamps 0.1.0.
        run: make windows windows-arm64 VERSION="${GITHUB_REF_NAME#v}"

      - name: record whether the signing certificate is available
        id: cert
        # The comparison renders true or false; the secret itself is never read
        # into the log or the output.
        run: echo "present=${{ secrets.WIN_CERT_PFX_B64 != '' }}" >> "$GITHUB_OUTPUT"

      - name: upload the unsigned binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries
          path: build/*.exe
          if-no-files-found: error

  sign:
    name: authenticode sign
    needs: build
    if: needs.build.outputs.sign == 'true'
    runs-on: windows-latest
    steps:
      - name: download the unsigned binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries
          path: build

      - name: put the windows sdk signtool on the path
        shell: pwsh
        run: |
          $tool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $tool) { throw "signtool.exe not found in the windows sdk" }
          Add-Content -Path $env:GITHUB_PATH -Value $tool.Directory.FullName

      - name: decode the signing certificate
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WIN_CERT_PFX_B64 }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:PFX_B64))

      - name: sign and verify both binaries
        shell: pwsh
        # WIN_CERT_PASSWORD travels with WIN_CERT_PFX_B64: set both or neither.
        env:
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f "$env:RUNNER_TEMP\cert.pfx" /p "$env:WIN_CERT_PASSWORD" build\amcache_windows.ext.exe build\amcache_windows_arm64.ext.exe
          signtool verify /pa build\amcache_windows.ext.exe build\amcache_windows_arm64.ext.exe

      - name: delete the decoded certificate
        # Runs even when signing failed: the private key must not outlive the job.
        if: always()
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\cert.pfx"

      - name: upload the signed binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries
          path: build/*.exe
          overwrite: true
          if-no-files-found: error

  publish:
    name: publish the release
    needs: [build, sign]
    if: always() && needs.build.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download the binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries
          path: build

      - name: checksum the exact bytes that ship
        # After signing, never before: signtool rewrites the PE. sha256sum here
        # and `shasum -a 256` in the Makefile emit the same format, so either
        # verifies this file.
        working-directory: build
        run: sha256sum *.exe > SHA256SUMS

      - name: create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" build/*.exe build/SHA256SUMS --generate-notes
